 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="utf-8">
  <title>Date()</title>
 </head>
 <body>
 <p>&copy;</p>
 <script>
    let today = new Date();
let year = today.getFullYear();
document.querySelector("p").textContent +=  `${year}  JavaScript`;
 </script>
 </body>
 </html>
